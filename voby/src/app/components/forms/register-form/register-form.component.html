<div class="container">
  <div class="intro">
    <img src="../../../../assets/voby_full_tsp.png" height="200px" />
    <p
      style="
        color: white;
        font-size: 1.5em;
        font-weight: 500;
        line-height: 2em;
        color: var(--voby-accent);
        margin-top: -1em;
      "
    >
      Your guide to new cultures!
    </p>
    <img class="visual" src="../../assets/undraw_the_world_is_mine.svg" />
  </div>
  <form [formGroup]="registerForm">
    <h1 style="color: var(--voby-primary)">Welcome aboard !</h1>
    <mat-form-field class="input" appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput name="username" formControlName="username" />
    </mat-form-field>

    <mat-form-field class="input" appearance="outline">
      <mat-label>Password</mat-label>
      <input
        type="password"
        matInput
        name="password1"
        formControlName="password1"
      />
    </mat-form-field>

    <mat-form-field class="input" appearance="outline">
      <mat-label>Confirm password</mat-label>
      <input
        type="password"
        matInput
        name="password2"
        formControlName="password2"
      />
    </mat-form-field>

    <button mat-flat-button type="submit" (click)="register()">register</button>
    <div style="display: flex; flex-direction: row" class="voby-secondary-text">
      or <a href="/login" style="margin-left: 0.3em">login</a>
    </div>
  </form>
</div>
